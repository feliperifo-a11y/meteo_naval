name: Verificar app gratuita
on:
  pull_request:
    paths: ['app/**', 'build/**', 'data/geo/sar.json', 'data/geo/talcahuano.*', 'scripts/construir_index.py', 'scripts/verificar_app.py', 'scripts/marejadas_uv.py', 'scripts/talcahuano_observaciones.py', 'requirements.txt', '.github/workflows/actualizar.yml', 'sw-app.js', 'tests/**', '.github/workflows/verificar-app.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construir y verificar rutas e íconos
        run: |
          python scripts/construir_index.py
          python scripts/verificar_app.py
      - name: Verificar app y capas opcionales
        run: node --test tests/*.test.cjs
      - name: Verificar lectura y georreferencia UV
        run: |
          pip install numpy pillow pyproj
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m unittest discover -s tests -p "test_*.py"
