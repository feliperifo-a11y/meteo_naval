name: Diagnóstico carta
on:
  push:
    branches: [diag-carta]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests numpy pygrib
      - name: Viento
        run: mkdir -p diag/viento data && python scripts/viento.py | tee diag/viento/log.txt && cp data/viento_gfs.json diag/viento/ || true
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/viento && git commit -m "diag: viento" && git push || true
