name: Diagnóstico carta
on:
  push:
    branches: [diag-carta]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Descargar imágenes
        run: |
          mkdir -p diag/out
          curl -sS -D diag/out/visual_hdr.txt -o diag/out/visual.png https://web.directemar.cl/met/jturno/pub/GFS/visual.png
          curl -sS -o diag/out/color.png https://web.directemar.cl/met/jturno/pub/GFS/color.png
      - name: Publicar resultados en la rama
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/out && git commit -m "diag: visual" && git push || true
