name: Diagnóstico carta
on:
  push:
    branches: [diag-carta]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Descarga IR
        run: |
          mkdir -p diag/ir
          curl -sS -m 60 -D diag/ir/headers.txt -o diag/ir/color.png "https://web.directemar.cl/met/jturno/pub/GFS/color.png" || echo FALLO > diag/ir/error.txt
      - name: Publicar resultados en la rama
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/ir && git commit -m "diag: IR" && git push || true
