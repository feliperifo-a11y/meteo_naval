name: Diagnóstico trombas (único)
on:
  push:
    branches: [diag-trombas]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Datos publicados (aviso y cálculos del sitio)
        run: |
          mkdir -p diag
          for f in avisos.json trombas.json trombas_prob.json; do curl -fsSL "https://meteoia.cl/data/$f" -o "diag/$f" || echo "sin $f"; done
      - name: Ingredientes en el área del aviso
        run: python diag_trombas.py
      - name: Guardar
        run: |
          git config user.name "diag"; git config user.email "diag@users.noreply.github.com"
          git add diag && git commit -m "Resultado del diagnóstico" && git push
