name: Diagnóstico carta
on:
  push:
    branches: [diag-carta]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Descargar pronósticos
        run: |
          mkdir -p diag/hielo
          while read u; do f=$(basename "$u"); curl -sS -m 30 -D "diag/hielo/$f.hdr" -o "diag/hielo/$f" "$u" || echo "ERR $u" >> diag/hielo/errores.txt; done < diag/urls_hielo.txt
      - name: Publicar resultados en la rama
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/hielo && git commit -m "diag: hielo" && git push || true
