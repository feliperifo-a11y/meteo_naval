name: explorar-meteogramas
on: workflow_dispatch
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp_explorar
          curl -s -m 40 "https://meteoarmada.directemar.cl/meteo/site/edic/base/port/Modelo_meteogramas.html" -o tmp_explorar/mg.html || echo "fallo" > tmp_explorar/error.txt
          git config user.name "explorador"; git config user.email "explorador@users.noreply.github.com"
          git add tmp_explorar; git commit -m "temporal: catálogo de meteogramas" && git push
