name: Actualizar y publicar

on:
  schedule:
    - cron: "7,27,47 * * * *"  # cada 20 min en :07, :27 y :47 (evita las horas en punto, más congestionadas en GitHub)
    - cron: "17 12 * * 1"      # lunes: latido semanal para que GitHub no pause las tareas programadas
  workflow_dispatch:            # botón "Run workflow" para ejecutarlo a mano
    inputs:
      releer:
        description: "Volver a leer todos los PDF de avisos"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["build/**", "data/avisos_manual.json", "data/estaciones.json", "data/geo/**", "scripts/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar los avisos ya publicados
        # Permite conservar avisos aún vigentes y no volver a leer PDFs ya procesados.
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "$OWNER.github.io" ]; then BASE="https://$OWNER.github.io"; else BASE="https://$OWNER.github.io/$REPO"; fi
          curl -fsSL "$BASE/data/avisos.json" -o data/avisos.json || echo "Sin avisos previos publicados"

      - name: Recolectar datos
        env:
          RELEER: ${{ inputs.releer && '1' || '0' }}
        run: python scripts/colector.py

      - name: Construir la página
        run: |
          python scripts/construir_index.py
          mkdir -p _site/data
          cp index.html _site/
          cp data/estaciones.json data/avisos.json data/estado.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Latido semanal
        if: github.event.schedule == '17 12 * * 1'
        run: |
          date -u +%Y-%m-%dT%H:%MZ > .github/latido.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latido.txt
          git commit -m "Latido semanal" && git push || true
