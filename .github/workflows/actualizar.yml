name: Actualizar y publicar

on:
  schedule:
    - cron: "7,27,47 * * * *"  # cada 20 min en :07, :27 y :47 (evita las horas en punto, más congestionadas en GitHub)
    - cron: "17 12 * * 1"      # lunes: latido semanal para que GitHub no pause las tareas programadas
  workflow_dispatch:            # botón "Run workflow" para ejecutarlo a mano
    inputs:
      releer:
        description: "Volver a leer todos los PDF de avisos"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["build/**", "app/**", "sw.js", "sw-app.js", "favicon.ico", "ia.html", "pronosticos.html", "hielos.html", "nuevo.html", "dashboard.html", "data/avisos_manual.json", "data/estaciones.json", "data/estaciones_extra.json", "data/wrf_ia.json", "data/geo/**", "scripts/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr

      - name: Recuperar los datos ya publicados
        # Conserva avisos vigentes y el seguimiento de estaciones entre ejecuciones.
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "$OWNER.github.io" ]; then BASE="https://$OWNER.github.io"; else BASE="https://$OWNER.github.io/$REPO"; fi
          for f in marejadas_uv.json wrf_servimet.json marejadas_uv_valparaiso.json talcahuano_observaciones.json avisos.json seguimiento.json oleaje.json carta.json carta_isobaras.json carta_frentes.png carta_frentes_polar.png carta.jpg satelite.json satelite_ir.png satelite_polar.png satelite_vis.json satelite_vis.png satelite_vis_polar.png restricciones.json pronosticos.json hielo.json hielo_conc.png hielo_etapa.png hielo_bremen.png satelite_hielo.png satelite_vis_hielo.png boyas_estado.json viento_gfs.json fondo_polar.jpg fondo_polar.json fondo_hielo.jpg fondo_hielo.json; do
            if curl -fsSL "$BASE/data/$f" -o "/tmp/$f" && [ -s "/tmp/$f" ]; then mv "/tmp/$f" "data/$f"; else echo "Sin $f publicado; se usa el del repositorio"; fi
          done

      - name: Recolectar datos
        env:
          RELEER: ${{ inputs.releer && '1' || '0' }}
          # Claves de las redes complementarias: se guardan en Settings → Secrets and variables → Actions
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
          WL_API_KEY: ${{ secrets.WL_API_KEY }}
          WL_API_SECRET: ${{ secrets.WL_API_SECRET }}
          DEPURAR_IFOP: "1"
        run: python scripts/colector.py

      - name: Observaciones complementarias de Talcahuano
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/talcahuano_observaciones.py

      - name: Pronósticos WRF + IA
        # Solo consulta la IA cuando cambia un meteograma (nueva corrida del modelo).
        continue-on-error: true
        timeout-minutes: 8
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/wrf_ia.py

      - name: Oleaje (Open-Meteo Marine)
        # Se consulta como máximo cada 3 h; si falla, se mantiene el último dato publicado.
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/oleaje.py

      - name: Marejadas UV (Talcahuano, cada dos horas)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if python scripts/marejadas_uv.py; then true; else echo "Se conserva la última corrida UV válida"; fi

      - name: Marejadas UV (Valparaíso, cada dos horas)
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/marejadas_uv.py --dominio valparaiso

      - name: WRF SERVIMET (Talcahuano, cada dos horas)
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/wrf_servimet.py

      - name: Carta sinóptica (isobaras GFS + frentes)
        # Solo procesa cuando se publica una carta nueva; si falla, se mantiene la capa anterior.
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/carta.py

      - name: Imagen satelital IR (nubosidad)
        # Solo procesa cuando se publica una imagen nueva; si falla, se mantiene la capa anterior.
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/satelite.py

      - name: Imagen satelital visible (nubosidad diurna)
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/satelite_vis.py

      - name: Pronósticos marítimos publicados (bahías y áreas)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/pronosticos.py

      - name: Monitoreo de hielos (cartas de hielo, hielo en cubierta, témpanos)
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/hielos.py

      - name: Estado declarado de las boyas (visor oficial)
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/boyas_estado.py

      - name: Restricciones portuarias (SITPORT, respaldo)
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/restricciones.py

      - name: Viento GFS (campo para la versión nueva)
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/viento.py

      - name: Fondos de relieve para la carta polar y las cartas de hielo (solo si faltan o cambia la proyección)
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/fondo_polar.py

      - name: Construir la página
        run: |
          python scripts/construir_index.py
          mkdir -p _site/data/geo
          cp index.html dashboard.html ia.html pronosticos.html hielos.html nuevo.html version.txt sw.js sw-app.js favicon.ico apple-touch-icon.png apple-touch-icon-precomposed.png _site/
          cp -r app _site/
          cp data/geo/talcahuano.geojson data/geo/talcahuano.kml _site/data/geo/
          cp data/geo/valparaiso.geojson data/geo/valparaiso.kml data/geo/valparaiso_limites.json _site/data/geo/
          cp data/estaciones.json data/avisos.json data/estado.json data/seguimiento.json _site/data/
          [ -f data/wrf_ia.json ] && cp data/wrf_ia.json _site/data/ || true
          [ -f data/oleaje.json ] && cp data/oleaje.json _site/data/ || true
          cp data/hielo_cubierta_*.png _site/data/ 2>/dev/null || true
          for f in marejadas_uv.json wrf_servimet.json marejadas_uv_valparaiso.json talcahuano_observaciones.json carta.json carta_isobaras.json carta_frentes.png carta_frentes_polar.png carta.jpg satelite.json satelite_ir.png satelite_polar.png satelite_vis.json satelite_vis.png satelite_vis_polar.png restricciones.json pronosticos.json hielo.json hielo_conc.png hielo_etapa.png hielo_bremen.png satelite_hielo.png satelite_vis_hielo.png boyas_estado.json viento_gfs.json fondo_polar.jpg fondo_polar.json fondo_hielo.jpg fondo_hielo.json; do [ -f data/$f ] && cp data/$f _site/data/ || true; done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Latido semanal
        if: github.event.schedule == '17 12 * * 1'
        run: |
          date -u +%Y-%m-%dT%H:%MZ > .github/latido.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latido.txt
          git commit -m "Latido semanal" && git push || true

