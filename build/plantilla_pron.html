<link rel="manifest" href="app/app.webmanifest">
<meta name="theme-color" content="#0f2a44">
<meta name="apple-mobile-web-app-title" content="MeteoIA">

<style>/*LEAFLET_CSS*/</style>
<style>
:root{--bg:#0a1a2c;--panel:#0d2136;--panel2:#10284200;--line:#1e3a58;--ink:#e8f1fb;--mut:#93a9c0;--acc:#2f8cff;--chip:#0f2a45;--mn:#6fb2ff;--mx:#ff7a6b}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
a{color:#7fb8ff}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;background:linear-gradient(180deg,#0e2540,#0a1d33);border-bottom:1px solid var(--line);flex-wrap:wrap}
.marca{display:flex;align-items:center;background:#fff;border-radius:9px;padding:4px 8px;flex:none}.marca img{height:42px;display:block}
.tit{border-left:1px solid var(--line);padding-left:16px;min-width:0}
.tit h1{margin:0;font-size:20px;font-weight:700;color:#fff;line-height:1.2}.tit .sub{font-size:12.5px;color:var(--mut)}
.hDer{margin-left:auto;display:flex;align-items:center;gap:10px}
.diaNav{display:flex;align-items:center;border:1px solid var(--line);background:var(--chip);border-radius:9px;overflow:hidden}
.diaNav span{display:flex;align-items:center;gap:9px;padding:7px 14px;font-weight:600;font-size:13.5px;text-transform:capitalize;min-width:170px}
.diaNav svg{width:18px;height:18px}
.diaNav button{background:none;border:0;border-left:1px solid var(--line);width:38px;height:36px;cursor:pointer;font-size:18px}.diaNav button:disabled{opacity:.35;cursor:default}
.diaNav button:hover:not(:disabled){background:#163a5e}
.btnV{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--chip);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.btnV:hover{background:#163a5e}
main{flex:1;display:grid;grid-template-columns:72px 340px minmax(0,1fr) 410px;min-height:0}
/* barra lateral */
.rail{background:#0b1d31;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0}
.rail button{width:60px;border:0;background:none;color:#c9d9ea;border-radius:12px;padding:9px 0 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px}
.rail button svg{width:24px;height:24px}.rail button.on{background:var(--acc);color:#fff}.rail button:hover:not(.on){background:#13304f}
/* lista */
.lista{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lCab{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.lCab h2{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-size:16px}
.buscar{position:relative}.buscar input{width:100%;font:inherit;font-size:13.5px;padding:9px 12px 9px 36px;border-radius:9px;border:1px solid var(--line);background:#0a1a2c;color:var(--ink)}
.buscar svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{border:1px solid var(--line);background:#0a1a2c;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#lista{flex:1;overflow-y:auto;min-height:0}
.zH{position:sticky;top:0;z-index:2;background:#0b1d31;border-bottom:1px solid var(--line);padding:7px 14px;font-size:11.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#c9d9ea}
.bi{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;align-items:center;padding:9px 12px 9px 14px;border-bottom:1px solid rgba(30,58,88,.7);cursor:pointer;border-left:3px solid transparent}
.bi:hover{background:#10294a}.bi.sel{background:#123557;border-left-color:#ff9f1a}
.bi .ic{grid-row:1/3}
.bi .nm{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;min-width:0}.bi .nm span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res{font-size:10.5px;font-weight:600;color:#c9d9ea;background:#183a5c;border-radius:5px;padding:1px 6px;white-space:nowrap}
.bi .ln{display:flex;gap:12px;font-size:12px;color:#c9d9ea;min-width:0;white-space:nowrap;overflow:hidden}
.bi .ln span{display:inline-flex;align-items:center;gap:4px}.bi .ln svg{width:14px;height:14px;flex:none}
.bi .tp{font-size:12.5px;white-space:nowrap;text-align:right}
.fav{background:none;border:0;cursor:pointer;color:#8aa0b6;padding:2px;line-height:0}.fav svg{width:19px;height:19px}.fav.on{color:#ffc53d}
.mn{color:var(--mn);font-weight:700}.mx{color:var(--mx);font-weight:700}
.vacio{padding:14px;color:var(--mut);font-size:13px}
/* mapa */
.mapa{position:relative;min-width:0}
#map{position:absolute;inset:0;background:#0b2033}
#capasMapa{position:absolute;left:12px;top:92px;z-index:800;background:rgba(10,26,44,.94);border:1px solid var(--line);border-radius:12px;padding:6px;width:190px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#capasMapa .t{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);padding:5px 8px 3px}
.cm{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13px}
.cm svg{width:19px;height:19px;flex:none}.cm input{display:none}
.cm:has(input:checked){background:var(--acc);color:#fff}.cm:hover:not(:has(input:checked)){background:#163a5e}
#capasMapa select{width:calc(100% - 12px);margin:2px 6px 6px;background:#0f2a45;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px;font:inherit;font-size:12.5px}

  return `<div class="bi${it.codigo === SEL ? ' sel' : ''}" data-c="${escH(it.codigo)}">
    <span class="ic">${icono(p, 30)}</span>
    <span class="nm"><span class="t">${escH(it.nombre)}</span>${badge}</span>
    <span class="tp">${p ? (tieneT(p) ? `<span class="mn">${tG(p.tmin)}</span> / <span class="mx">${tG(p.tmax)}</span>` : '') : '<span style="color:var(--mut)">sin datos</span>'}</span>
    <span class="ln">${p ? `<span>${ICO.viento}${escH(vientoCorto(p) || '–')}</span>${mc ? `<span>${ICO.ola}${escH(mc)}</span>` : ''}` : `<span class="${(it.periodos || []).length ? '' : 'err'}">${escH(it.error || ((it.periodos || []).length ? 'Sin pronóstico para este día' : 'Sin pronóstico'))}</span>`}</span>
    <button type="button" class="fav${fav ? ' on' : ''}" data-f="${escH(it.codigo)}" title="${fav ? 'Quitar de favoritos' : 'Agregar a favoritos'}" aria-label="Favorito">${fav ? ICO.estrellaOn : ICO.estrella}</button></div>`;
}
const grupos = () => [...new Set(DATOS.items.map(it => it.grupo))];
function pintarLista() {
  const vs = visibles();
  document.getElementById('tLista').textContent = VISTA === 'fav' ? 'Favoritos' : VISTA === 'bahia' ? 'Pronósticos por bahía' : VISTA === 'area' ? 'Pronósticos por área' : 'Pronósticos por bahía y área';
  const html = grupos().map(z => { const its = vs.filter(it => it.grupo === z); return its.length ? `<div class="zH">${escH(z)}</div>` + its.map(item).join('') : ''; }).join('');
  document.getElementById('lista').innerHTML = html || `<div class="vacio">${VISTA === 'fav' ? 'Aún no tienes favoritos: marca la estrella de un lugar para agregarlo.' : 'No hay lugares que coincidan con la búsqueda.'}</div>`;
  document.querySelectorAll('#lista .bi').forEach(el => el.onclick = e => { if (e.target.closest('.fav')) return; seleccionar(el.dataset.c, true); });
  document.querySelectorAll('#lista .fav').forEach(bt => bt.onclick = () => alternarFav(bt.dataset.f));
}
function alternarFav(c) { FAV.has(c) ? FAV.delete(c) : FAV.add(c); guardarFav(); pintarLista(); pintarDetalle(); if (VISTA === 'fav') pintarMapa(); }
function pintarChips() {
  const corto = z => z.replace(' (pronóstico general marítimo)', ' (general)').replace(' (Zona X)', '');
  document.getElementById('chips').innerHTML = ['', ...grupos()].map(z => `<button type="button" data-z="${escH(z)}" class="${z === ZONA ? 'on' : ''}" title="${escH(z || 'Todos los sectores')}">${z ? escH(corto(z)) : 'Todos'}</button>`).join('');
  document.querySelectorAll('#chips button').forEach(bt => bt.onclick = () => { ZONA = bt.dataset.z; try { localStorage.setItem('pron_zona', ZONA); } catch (e) {} if (SEL && !visibles().some(it => it.codigo === SEL)) SEL = null; pintarChips(); todo(); encuadrar(); });
}
document.getElementById('busca').oninput = e => { BUSCA = norm(e.target.value.trim()); todo(); };
document.querySelectorAll('.rail button').forEach(bt => bt.onclick = () => { VISTA = bt.dataset.v; document.querySelectorAll('.rail button').forEach(x => x.classList.toggle('on', x === bt)); todo(); encuadrar(); });
function fechasDisponibles() {
  const fs = [...new Set(DATOS.items.flatMap(it => (it.periodos || []).map(p => p.fecha)).filter(Boolean))].sort();
  const hoy = hoyChile(), fut = fs.filter(f => f >= hoy).slice(0, 3);
  return fut.length ? fut : fs.slice(-3);
}
function pintarDia() {
  const fs = fechasDisponibles(), hoy = hoyChile();
  if (!fs.includes(FECHA)) FECHA = fs.includes(hoy) ? hoy : fs[0];
  const i = fs.indexOf(FECHA);
  document.getElementById('diaTxt').textContent = (FECHA === hoy ? 'Hoy, ' : FECHA === fs[fs.indexOf(hoy) + 1] && fs.includes(hoy) ? 'Mañana, ' : '') + fDia(FECHA);
  document.getElementById('diaAnt').disabled = i <= 0; document.getElementById('diaSig').disabled = i >= fs.length - 1;
  document.getElementById('diaAnt').onclick = () => { if (i > 0) { FECHA = fs[i - 1]; pintarDia(); todo(); } };
  document.getElementById('diaSig').onclick = () => { if (i < fs.length - 1) { FECHA = fs[i + 1]; pintarDia(); todo(); } };
}
function todo() { pintarLista(); pintarMapa(); pintarDetalle(); }

// ============================ Detalle ============================
function estacionCercana(pos) {
  let mejor = null;
  for (const s of EST) { const t = parseLocalCL(s.fecha) || s.cambio; if (!t || Date.now() - t > 3 * 3600e3) continue;
    const dd = Math.hypot(s.lat - pos[0], (s.lon - pos[1]) * Math.cos(pos[0] * Math.PI / 180)); if (dd < 0.45 && (!mejor || dd < mejor.dd)) mejor = { s, dd, t }; }
  return mejor;
}
// Lectura rápida de condiciones para la operación habitual a partir del viento y el mar del pronóstico
function semaforo(it) {
  const ps = periodosDe(it, FECHA); if (!ps.length) return '';
  const v = Math.max(-1, ...ps.map(vientoMax).filter(x => x != null)), o = Math.max(-1, ...ps.map(olaMax).filter(x => x != null));
  if (it.aviso || v >= 34 || o >= 4) return `<div class="chipEst rj">${ICO.ojo}<span>${it.aviso ? escH(it.aviso) + ' · ' : ''}Condiciones adversas: extreme las precauciones${v >= 34 ? ` (viento hasta ${v} kt)` : ''}${o >= 4 ? ` (mar hasta ${nf(o, 1)} m)` : ''}.</span></div>`;
  if (v >= 22 || o >= 2.5) return `<div class="chipEst am">${ICO.ojo}<span>Condiciones moderadas: atención al viento${v > 0 ? ` (hasta ${v} kt)` : ''}${o > 0 ? ` y al mar (hasta ${nf(o, 1)} m)` : ''}.</span></div>`;
  return `<div class="chipEst ok">${ICO.ojo}<span>Sin viento ni mar relevantes en el pronóstico de este día${v > 0 ? ` (viento hasta ${v} kt` : ''}${o > 0 ? `${v > 0 ? ', ' : ' ('}mar hasta ${nf(o, 1)} m` : ''}${v > 0 || o > 0 ? ')' : ''}.</span></div>`;
}
function bloquePeriodo(p) {
  return `<div class="perB"><div class="perH">${icono(p, 30)}<div><b>${p.tipo === 'noche' ? 'Noche' : 'Día'} · ${escH(fDia(p.fecha, true))}</b><br><small>${escH(p.horario || '')}</small></div>${tieneT(p) ? `<div style="margin-left:auto;font-size:16px"><b class="mn">${tG(p.tmin)}</b> / <b class="mx">${tG(p.tmax)}</b></div>` : ''}</div>
    <div class="per">${p.nubosidad ? `<span class="k">Nubosidad</span><span>${escH(p.nubosidad)}</span>` : ''}${p.visibilidad ? `<span class="k">Visibilidad</span><span>${escH(p.visibilidad)}</span>` : ''}${p.fenomenos ? `<span class="k">Fenómenos</span><span style="color:#7fc4ff">${escH(p.fenomenos)}</span>` : ''}
    <span class="k">Viento</span><span>${escH(p.viento || '–')}</span><span class="k">Mar</span><span>${escH(p.mar || '–')}</span>${p.uv ? `<span class="k">Índice UV</span><span>${escH(p.uv)}</span>` : ''}</div></div>`;
}
function pintarDetalle() {
  const el = document.getElementById('det');
  const it = DATOS && DATOS.items.find(x => x.codigo === SEL);
  if (!it) { el.innerHTML = '<div class="card vacio">Elige una bahía o un área en la lista o en el mapa para ver su pronóstico.</div>'; return; }
  const fav = FAV.has(it.codigo), pos = it.pos, fs = [...new Set((it.periodos || []).map(p => p.fecha))].sort();
  const ban = `<div class="banner"><svg class="olas" viewBox="0 0 400 46" preserveAspectRatio="none"><path d="M0 22c40-14 80 14 120 0s80-14 120 0 80 14 160-4v28H0Z" fill="#1f6fb0" opacity=".7"/><path d="M0 32c50-12 90 10 140-2s90-10 130 2 90 8 130-6v20H0Z" fill="#0b3a66"/></svg>
    <button type="button" class="fav${fav ? ' on' : ''}" data-f="${escH(it.codigo)}" title="${fav ? 'Quitar de favoritos' : 'Agregar a favoritos'}">${fav ? ICO.estrellaOn : ICO.estrella}</button>
    <div class="z" style="font-size:12.5px">${escH(it.grupo)} ›</div><h2>${escH(it.nombre)}</h2>
    <div class="tags"><span>${it.tipo === 'area' ? 'Área o ruta marítima' : 'Bahía'}</span>${it.metarea ? `<span>METAREA ${escH(it.metarea.replace('-', '·'))}</span>` : ''}${it.aviso ? `<span style="background:#c62828;border-color:#c62828;font-weight:700">${escH(it.aviso)}</span>` : ''}</div></div>`;
  const tabs = `<div class="tabsD" id="tabsD">${[['pron', 'Pronóstico'], ['tabla', 'Detalle'], ['info', 'Información']].map(([k, n]) => `<button type="button" data-t="${k}" class="${TABD === k ? 'on' : ''}">${n}</button>`).join('')}</div>`;
  // condiciones actuales (solo bahías con punto propio)
  let cond = '';
  const ec = pos && it.tipo !== 'area' && estacionCercana(pos);
  if (ec) { const s = ec.s, kt = aKt(s.vel, s.uVel), ra = aKt(s.racha, s.uVel);
    cond = `<div class="card"><h3>Condiciones actuales <span class="der" style="font-size:11.5px;color:var(--mut);font-weight:500">${escH(fmtDM(ec.t))} (hora Chile)</span></h3><div class="cond">
      <div>${ICO.term}<div><div class="v">${s.temp != null ? nf(s.temp, 1) : '–'} <small>°C</small></div><div class="l">Temperatura</div></div></div>
      <div>${flechaDir(s.dirG)}<div><div class="v">${kt != null ? nf(kt, 0) : '–'} <small>kt</small></div><div class="l">${s.dirG != null ? cardinal(s.dirG) + ' · ' : ''}viento</div></div></div>
      <div><div><div class="v">${ra != null ? nf(ra, 0) : '–'} <small>kt</small></div><div class="l">Rachas</div></div></div>
      <div><div><div class="v">${s.pres != null ? nf(s.pres, 0) : '–'} <small>hPa</small></div><div class="l">Presión</div></div></div></div>
      <div class="notaC">Estación ${escH(nombreEst(s))} (a ${Math.round(ec.dd * 111)} km).</div></div>`; }
  // tarjetas por día (período diurno o el primero)
  const dias = fs.map(f => { const p = principal(it, f), mc = marCorto(p);
    return `<div class="d3"${f === FECHA ? ' style="background:rgba(47,140,255,.12);border-radius:8px"' : ''}><div class="n">${escH(fDia(f).replace(/ \S+$/, ''))}</div>${icono(p, 34)}${tieneT(p) ? `<div class="t"><b class="mn">${tG(p.tmin)}</b> / <b class="mx">${tG(p.tmax)}</b></div>` : '<div class="t" style="color:var(--mut);font-size:12px">–</div>'}
      <div class="r" title="${escH(p.viento || '')}">${ICO.viento}${escH(vientoCorto(p) || '–')}</div>${mc ? `<div class="r" title="${escH(p.mar || '')}">${ICO.ola}${escH(mc)}</div>` : ''}${p.fenomenos ? `<div class="pp">${escH(p.fenomenos)}</div>` : ''}</div>`; }).join('');
  const sit = (periodosDe(it, FECHA).find(p => p.situacion) || (it.periodos || []).find(p => p.situacion) || {}).situacion;
  let cuerpo;
  if (!(it.periodos || []).length) cuerpo = `<div class="card"><p class="err" style="margin:0">${escH(it.error || 'Sin pronóstico disponible')}</p></div>`;
  else if (TABD === 'tabla') { const ps = periodosDe(it, FECHA);
    cuerpo = `<div class="card"><h3>Pronóstico completo · <span style="text-transform:capitalize;font-weight:500">${escH(fDia(FECHA, true))}</span></h3>${ps.length ? ps.map(bloquePeriodo).join('') : `<div class="notaC">Este texto no trae pronóstico para ${escH(fDia(FECHA, true))}; cubre ${escH(fs.map(f => fDia(f)).join(', '))}.</div>`}
      ${it.nota ? `<div class="notaC">${escH(it.nota)}</div>` : ''}</div>`; }
  else if (TABD === 'info') cuerpo = `<div class="card"><h3>${ICO.info}Información del pronóstico</h3><div class="info">
      <span class="k">Tipo</span><span>${it.tipo === 'area' ? 'Área o ruta marítima' : 'Bahía'}</span><span class="k">Sector</span><span>${escH(it.grupo)}</span>
      ${it.metarea ? `<span class="k">Zona marítima</span><span>${escH(nombreArea((METAREA.features.find(f => f.properties.id === it.metarea) || { properties: { id: it.metarea, nombre: it.metarea, tipo: '' } }).properties))}</span>` : ''}
      <span class="k">Emitido</span><span>${it.emitido ? `${escH(fmtEmit(it.emitido))} (hora local)` : 'Pronóstico general de 24 h'}</span><span class="k">Días</span><span>${escH(fs.map(f => fDia(f)).join(' · '))}</span></div>
      <div class="links"><a class="btnS" href="${escH(it.url)}" target="_blank" rel="noopener">Pronóstico publicado ↗</a>${it.txt && it.txt !== it.url ? `<a class="btnS" href="${escH(it.txt)}" target="_blank" rel="noopener">Texto original ↗</a>` : ''}<a class="btnS" href="dashboard.html?carta">Carta de superficie →</a></div>
      <div class="notaC" style="margin-top:10px">Transcrito automáticamente desde el texto publicado. Ante cualquier duda, prevalece el texto original. Producto referencial: no reemplaza los avisos oficiales.</div></div>`;
  else cuerpo = `<div class="card"><h3><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Pronóstico por día<button type="button" class="btnS der" id="verTabla">Ver detalle →</button></h3><div class="dias3">${dias}</div>${semaforo(it)}</div>` +
      (sit ? `<div class="card ia"><h3>${ICO.sinop}Situación sinóptica</h3><p class="sinop">${escH(sit)}</p></div>` : '') +
      `<div class="card"><h3>${ICO.info}Emisión</h3><div class="info"><span class="k">Emitido</span><span>${it.emitido ? `${escH(fmtEmit(it.emitido))} (hora local)` : 'Pronóstico general de 24 h'}</span>${it.metarea ? `<span class="k">Zona marítima</span><span>${escH(it.metarea.replace('-', '·'))}</span>` : ''}</div>
        <div class="links"><a class="btnS" href="${escH(it.url)}" target="_blank" rel="noopener">Pronóstico publicado ↗</a><a class="btnS" href="dashboard.html?carta">Carta de superficie →</a></div></div>`;
  el.innerHTML = ban + tabs + cond + cuerpo;
  el.querySelectorAll('.fav').forEach(bt => bt.onclick = () => alternarFav(bt.dataset.f));
  el.querySelectorAll('#tabsD button').forEach(bt => bt.onclick = () => { TABD = bt.dataset.t; pintarDetalle(); });
  const vt = el.querySelector('#verTabla'); if (vt) vt.onclick = () => { TABD = 'tabla'; pintarDetalle(); };
}
function seleccionar(cod, volar) {
  SEL = cod; try { localStorage.setItem('pron_sel', cod); } catch (e) {}
  document.querySelectorAll('#lista .bi').forEach(x => x.classList.toggle('sel', x.dataset.c === SEL));
  marcadores.forEach((m, c) => { const el = m.getElement(); if (el) el.querySelector('.iaM').classList.toggle('sel', c === SEL); });
  puntos.forEach((l, c) => { if (l.setStyle) l.setStyle({ fillColor: c === SEL ? '#ff9f1a' : '#21c79a' }); });
  pintarZonas();
  const li = document.querySelector(`#lista .bi[data-c="${CSS.escape(SEL)}"]`); if (li && innerWidth > 1000) li.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  const it = DATOS.items.find(x => x.codigo === SEL);
  if (it && volar) { if (it.rect || it.metarea) map.flyToBounds(limitesDe([it]).pad(0.15), { duration: 0.8, maxZoom: 7 }); else if (posDe(it)) map.flyTo(posDe(it), Math.max(map.getZoom(), 7), { duration: 0.8 }); }
  pintarDetalle(); document.getElementById('det').scrollTop = 0;
  if (innerWidth <= 1000 && !volar) document.getElementById('det').scrollIntoView({ behavior: 'smooth', block: 'start' });
  despejar();
}

// ============================ Carga ============================
async function cargar() {
  try {
    DATOS = await leerJSON('data/pronosticos.json');
    const e = await leerJSON('data/estaciones.json').catch(() => null);
    if (e) EST = (e.datos || []).map(x => ({ nombre: x.nombre, codigo: x.codigo, fecha: x.fecha, lat: +x.latitud, lon: +x.longitud, dirG: num(x.viento), vel: num(x.velocidadDelViento), temp: num(x.temperatura), pres: num(x.presion), racha: num(x._racha), uVel: x._unidad_viento || '', cambio: x._cambio ? new Date(x._cambio) : null, sinDatos: !!x._sin_datos }))
      .filter(s => isFinite(s.lat) && isFinite(s.lon) && !s.sinDatos);
    if (PRIMERA) {
      // ?lugar=CÓDIGO abre ese pronóstico; si no, el último consultado o Valparaíso
      let q = null; try { q = new URLSearchParams(location.search).get('lugar'); } catch (x) {}
      const qi = q && DATOS.items.find(x => x.codigo === q);
      if (qi) { ZONA = ''; }
      let u = null; try { u = localStorage.getItem('pron_sel'); } catch (x) {}
      const it = qi || (u && DATOS.items.find(x => x.codigo === u)) || DATOS.items.find(x => x.codigo === 'valparaiso') || DATOS.items[0];
      SEL = it ? it.codigo : null;
      if (ZONA && !DATOS.items.some(x => x.grupo === ZONA)) ZONA = '';
    }
    const n = DATOS.items.filter(it => (it.periodos || []).length).length;
    document.getElementById('sub').textContent = `${n} de ${DATOS.items.length} bahías y áreas con pronóstico · revisado ${fmtHora(DATOS.actualizado)} (hora Chile)`;
    pintarDia(); pintarChips(); todo();
    if (PRIMERA) { const it = DATOS.items.find(x => x.codigo === SEL), q = new URLSearchParams(location.search).get('lugar');
      if (q && it) { if (it.rect || it.metarea) map.fitBounds(limitesDe([it]).pad(0.2), { maxZoom: 7 }); else if (posDe(it)) map.setView(posDe(it), 7); } else encuadrar();
      const li = document.querySelector('#lista .bi.sel'); if (li && innerWidth > 1000) li.scrollIntoView({ block: 'center' }); }
    PRIMERA = false;
  } catch (e) {
    document.getElementById('sub').textContent = 'Sin datos';
    document.getElementById('lista').innerHTML = '<div class="vacio">Los pronósticos aún no están disponibles. Se actualizan con la próxima revisión automática.</div>';
  }
}
map.fitBounds(VISTA_INICIAL);
cargar(); cargarViento();
setInterval(cargar, 10 * 60000); setInterval(cargarViento, 30 * 60000);
setInterval(async () => {
  try { const v = (await (await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })).text()).trim(); if (v && v !== VERSION_PAGINA) location.reload(); } catch (e) {}
}, 5 * 60000);
window.addEventListener('load', () => { try { window.mnEvento && mnEvento('pronosticos'); } catch (e) {} });
</script>
