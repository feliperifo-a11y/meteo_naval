<style>/*LEAFLET_CSS*/</style>
<style>
/*AVISOS_MAPA_CSS*/
:root{--bg:#0a1a2c;--panel:#0d2136;--line:#1e3a58;--ink:#e8f1fb;--mut:#93a9c0;--acc:#2f8cff;--chip:#0f2a45;--ia:#b48cff;--of:#5fd08a;--wrf:#5fb0ff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
a{color:#7fb8ff}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:linear-gradient(180deg,#0e2540,#0a1d33);border-bottom:1px solid var(--line);flex-wrap:wrap}
.marca{display:flex;align-items:center;background:#fff;border-radius:9px;padding:4px 8px;flex:none}.marca img{height:42px;display:block}
.tit{border-left:1px solid var(--line);padding-left:16px;min-width:0;flex:1}
.tit h1{margin:0;font-size:20px;font-weight:700;color:#fff;line-height:1.2}.tit .sub{font-size:12.5px;color:var(--mut)}
.hDer{margin-left:auto;display:flex;align-items:center;gap:10px}
.btnV{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:9px;padding:8px 14px;text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap}
.btnV.az{background:var(--acc);border-color:var(--acc);color:#fff}
main{flex:1;display:flex;min-height:0}
.mapa{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:#0b2236}
.panel{width:440px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:12px 14px 20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:#0b1d31;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:14px}
.nota{font-size:12px;color:var(--mut);margin:4px 0}
.ac{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ac div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center}
.ac b{display:block;font-size:20px}.ac span{font-size:11px;color:var(--mut)}
.ac .ia{border-color:var(--ia)}.ac .ia b{color:var(--ia)}.ac .of b{color:var(--of)}.ac .wrf b{color:var(--wrf)}
.per{border-top:1px solid var(--line);padding:8px 0}.per:first-of-type{border-top:0}
.per h4{margin:0 0 4px;font-size:12.5px}
.f{display:grid;grid-template-columns:94px 1fr;gap:6px;margin:4px 0;font-size:12.5px}
.et{font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 6px;align-self:start;text-align:center}
.et.ia{background:rgba(180,140,255,.18);color:var(--ia)}.et.of{background:rgba(95,208,138,.16);color:var(--of)}
.f p{margin:0}
.vac{color:var(--mut);font-style:italic}
.capas{position:absolute;top:10px;right:10px;z-index:900;background:rgba(10,26,44,.92);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px}
.capas summary{cursor:pointer;font-weight:700;font-size:12px;color:var(--mut)}.capas[open] summary{margin-bottom:4px}
.capas label{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer}
.capas .t{font-size:11px;color:var(--mut);margin-top:4px}
.capas select{width:100%;margin-top:3px;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px}
.ley{position:absolute;left:10px;bottom:24px;z-index:900;background:rgba(10,26,44,.92);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:11.5px;line-height:1.6}
.ley i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.bLbl{background:none;border:0}
.bLbl div{transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:rgba(9,24,40,.9);border:2px solid var(--ia);border-radius:16px;padding:3px 9px 3px 4px;font-weight:700;font-size:12.5px;color:#fff;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.bLbl.sel div{background:var(--ia);color:#160c2e}
.bLbl em{font-style:normal;background:#2b1b52;color:#e5d9ff;border-radius:10px;padding:1px 6px;font-size:11px}
.bLbl.sel em{background:#160c2e;color:#e5d9ff}
.mLbl span{display:inline-block;transform:translate(-50%,-50%);color:#fff;font-weight:800;font-size:11.5px;text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.8)}
.pie{font-size:11.5px;color:var(--mut);margin-top:8px}
@media (max-width:900px){
  body{overflow:auto;display:block}main{display:block}.mapa{height:58vh}.panel{width:auto;border-left:0;border-top:1px solid var(--line)}
  header{gap:8px 10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px}.marca img{height:34px}.tit{border:0;padding:0}.tit h1{font-size:16px}
  .ley{display:none}
  .hDer{width:100%;margin:0}.hDer .btnV{flex:1;text-align:center}
}
</style>
</head>

  <div class="hDer"><a class="btnV" href="ia.html">Pronósticos WRF</a><a class="btnV az" href="./">← Volver al inicio</a></div>
</header>
<main>
  <section class="mapa">
    <div id="map" role="application" aria-label="Mapa de pronósticos WRF + IA"></div>
    <details class="capas" id="capas" open><summary>Capas</summary>
      <label><input type="checkbox" id="cBah" checked>Bahías WRF + IA</label>
      <label><input type="checkbox" id="cAv" checked>Avisos vigentes y próximos</label>
      <label><input type="checkbox" id="cMet" checked>METAREA XV</label>
      <div class="t">Mapa base</div>
      <select id="selBase" aria-label="Mapa base"><option value="sat">Imagen satelital</option><option value="oc">Océano</option><option value="cos">Sin conexión (costa)</option></select>
    </details>
    <div class="ley"><div><i style="background:rgba(255,77,77,.5);border:1.5px solid #ff4d4d"></i>Aviso vigente</div><div><i style="background:rgba(95,176,255,.2);border:1.5px dashed #5fb0ff"></i>Aviso próximo</div><div><i style="background:#b48cff"></i>Bahía con pronóstico WRF + IA</div></div>
  </section>
  <aside class="panel" id="panel"><div class="card vac">Cargando pronósticos…</div></aside>
</main>
<script>/*LEAFLET_JS*/</script>
<script>
/*DATA*/
/*AVISOS_MAPA_JS*/
const escH = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, d = 0) => (v == null || isNaN(v)) ? '–' : Number(v).toFixed(d).replace('.', ',');
const sg = (v, d = 1) => v == null ? '–' : (v > 0 ? '+' : '') + nf(v, d);
const fmtDM = d => d.toLocaleString('es-CL', { timeZone: 'America/Santiago', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).replace(',', '');
const fecha = f => { const d = new Date(f + 'T12:00:00'); return isNaN(d) ? (f || '–') : d.toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' }); };
const hora = iso => { const d = new Date(iso); return isNaN(d) ? '–' : fmtDM(d); };
async function leerJSON(ruta) { const r = await fetch(`${ruta}?t=${Date.now()}`, { cache: 'no-store', signal: AbortSignal.timeout(30000) }); if (!r.ok) throw new Error(r.status); return r.json(); }
function decodePolyline6(str) {
  const out = []; let i = 0, lat = 0, lon = 0;
  while (i < str.length) { for (let k = 0; k < 2; k++) { let b, sh = 0, r = 0; do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20); const d = (r & 1) ? ~(r >> 1) : (r >> 1); if (k === 0) lat += d; else lon += d; } out.push([lat / 1e6, lon / 1e6]); }
  return out;
}

// Posición de cada bahía (puerto) y código de la estación con la que se evalúa
const BAHIAS = { iquique: { pos: [-20.21, -70.16], id: 'IQQ' }, valparaiso: { pos: [-33.03, -71.63], id: 'VAL' }, talcahuano: { pos: [-36.71, -73.11], id: 'TAL' } };

// ---- Mapa
const map = L.map('map', { minZoom: 3, maxZoom: 13, zoomSnap: 0.25, zoomControl: false, maxBounds: [[-75, -150], [5, -30]], maxBoundsViscosity: 0.8 });
L.control.zoom({ position: 'topleft' }).addTo(map);
L.control.scale({ imperial: false, position: 'bottomright' }).addTo(map);
map.createPane('landPane').style.zIndex = 250;
map.createPane('metPane').style.zIndex = 360;
map.createPane('avPane').style.zIndex = 380;
map.createPane('lblPane').style.zIndex = 450; map.getPane('lblPane').style.pointerEvents = 'none';
map.createPane('bahPane').style.zIndex = 650;
const BASES = {
  sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Imagen © Esri', maxZoom: 17, maxNativeZoom: 13 }),
  oc: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri — GEBCO, NOAA', maxZoom: 16, maxNativeZoom: 13 }),
  cos: L.layerGroup()
};
for (const c of LAND) for (const poly of c.p) L.polygon(poly.map(decodePolyline6), { pane: 'landPane', color: '#8aa4bc', weight: 0.8, fillColor: '#1d3a52', fillOpacity: 1, interactive: false }).addTo(BASES.cos);
let base = null;
function ponerBase(k) { if (base) map.removeLayer(base); base = BASES[k]; base.addTo(map); document.getElementById('selBase').value = k; }
(function () { let ok = 0; BASES.sat.on('tileload', () => { ok++; }); setTimeout(() => { if (!ok && base === BASES.sat) ponerBase('cos'); }, 9000); ponerBase(navigator.onLine === false ? 'cos' : 'sat'); })();
document.getElementById('selBase').onchange = e => ponerBase(e.target.value);
const movil = matchMedia('(max-width:900px)').matches;
if (movil) document.getElementById('capas').open = false;
map.fitBounds(movil ? [[-38, -76], [-19, -68]] : [[-56.5, -86], [-17.5, -66]]);

// METAREA XV
const capaMet = L.layerGroup().addTo(map);
const nombreArea = p => p.tipo === 'costera' ? `Área ${p.id} · ${p.nombre}` : p.nombre;
L.geoJSON(METAREA, { pane: 'metPane', style: f => ({ color: '#ffffff', weight: f.properties.tipo === 'costera' ? 1.3 : 1.5, opacity: 0.8, dashArray: f.properties.tipo === 'costera' ? null : '7 6', fill: false }),
  onEachFeature: (f, l) => l.bindTooltip(escH(nombreArea(f.properties)), { sticky: true }) }).addTo(capaMet);
for (const f of METAREA.features) { const p = f.properties;
  L.marker(p.lp, { pane: 'lblPane', interactive: false, icon: L.divIcon({ className: 'mLbl', html: `<span>${escH(p.id.replace('-', '·'))}</span>`, iconSize: [0, 0] }) }).addTo(capaMet); }

// Avisos vigentes y próximos (data/avisos.json)
const capaAv = L.layerGroup().addTo(map);
function estadoAviso(z, ahora) { const ini = new Date(z.desde), fin = new Date(z.hasta); return ahora < ini ? 'P' : ahora <= fin ? 'V' : 'X'; }
function pintarAvisos(avisos) {
  capaAv.clearLayers(); const ahora = new Date();
  for (const a of avisos) for (const z of a.zonas || []) {
    const e = estadoAviso(z, ahora); if (e === 'X' || !z.geom) continue;
    const lyr = L.geoJSON(z.geom, { pane: 'avPane', style: { color: e === 'V' ? '#ff4d4d' : '#5fb0ff', weight: 2, dashArray: e === 'V' ? null : '6 4', fillColor: e === 'V' ? '#ff4d4d' : '#5fb0ff', fillOpacity: e === 'V' ? 0.25 : 0.1 } })
      .bindTooltip(`${escH(a.tipo)} · ${escH(z.nombre)} · ${e === 'V' ? 'vigente' : 'próximo'}<br>${escH(fmtDM(new Date(z.desde)))} a ${escH(fmtDM(new Date(z.hasta)))}`, { sticky: true }).addTo(capaAv);
    try { configurarAvisoInteractivo(lyr, a, z, escH, fmtDM, ahora); } catch (x) {}
  }
}

// Bahías con pronóstico WRF + IA
const capaBah = L.layerGroup().addTo(map);
for (const [id, c] of [['cBah', capaBah], ['cAv', capaAv], ['cMet', capaMet]]) document.getElementById(id).onchange = e => e.target.checked ? c.addTo(map) : map.removeLayer(c);

let BOR = null, OFI = {}, VER = null, SEL = null;
const promedio = cod => { const r = VER && VER.resumen && VER.resumen[(BAHIAS[cod] || {}).id]; return r || {}; };
function pintarMapa() {
  capaBah.clearLayers();
  for (const b of BOR.bahias) { const info = BAHIAS[b.codigo]; if (!info) continue;
    const pr = promedio(b.codigo).borr;
    L.marker(info.pos, { pane: 'bahPane', icon: L.divIcon({ className: 'bLbl' + (b.codigo === SEL ? ' sel' : ''), html: `<div>● ${escH(b.nombre)}${pr && pr.n ? `<em>${nf(pr.puntaje)} %</em>` : ''}</div>`, iconSize: [0, 0] }) })
      .on('click', () => seleccionar(b.codigo)).addTo(capaBah);
  }
}
function celdaAc(clase, nombre, a) { return `<div class="${clase}"><b>${a && a.n ? nf(a.puntaje) + ' %' : '–'}</b><span>${nombre}${a && a.n ? ` · ${a.n} d` : ''}</span></div>`; }
function pintarPanel() {
  const panel = document.getElementById('panel');
  const b = BOR.bahias.find(x => x.codigo === SEL);
  const tabs = `<div class="tabs" role="tablist">${BOR.bahias.map(x => `<button type="button" role="tab" data-c="${escH(x.codigo)}" aria-selected="${x.codigo === SEL}">${escH(x.nombre)}</button>`).join('')}</div>`;
  if (!b) { panel.innerHTML = tabs; return; }
  const r = promedio(b.codigo);
  const ult = VER && (VER.dias || []).find(x => x.bahia === (BAHIAS[b.codigo] || {}).id && x.borr && x.borr.pauta);
  const acierto = `<div class="card"><h3>Acierto contra lo observado</h3><div class="ac">${celdaAc('ia', 'WRF + IA', r.borr)}${celdaAc('of', 'Especialista', r.prof)}${celdaAc('wrf', 'WRF', r.wrf)}</div>`
    + `<p class="nota">Promedio de los días evaluados con la estación de capitanía de puerto (pauta O.P.I. N° 1104: dirección, intensidad y temperatura máxima, 08:00–20:00).${ult ? ` Último día evaluado (${escH(fecha(ult.fecha))}): WRF + IA ${nf(ult.borr.pauta.puntaje)} %${ult.prof && ult.prof.pauta ? `, especialista ${nf(ult.prof.pauta.puntaje)} %` : ''}${ult.wrf && ult.wrf.pauta ? `, WRF ${nf(ult.wrf.pauta.puntaje)} %` : ''}.` : ''}</p></div>`;
  const o = OFI[b.codigo], oDeHoy = o && (o.emitido || '').slice(0, 10) === BOR.fecha_base;
  const per = p => {
    const op = oDeHoy ? (o.periodos || []).find(q => q.fecha === p.fecha && ((q.horario || '').startsWith('20:00') ? 'noche' : (q.horario ? 'dia' : q.tipo)) === p.tipo) : null;
    const t = `${p.situacion ? p.situacion + ', ' : ''}${p.texto}${p.tmin != null || p.tmax != null ? ` · T ${p.tmin ?? '–'}/${p.tmax ?? '–'} °C` : ''}`;
    const to = op ? `${op.situacion ? op.situacion + ', ' : ''}${op.texto || ''}${op.tmin != null || op.tmax != null ? ` · T ${op.tmin ?? '–'}/${op.tmax ?? '–'} °C` : ''}` : null;
    return `<div class="per"><h4>${escH(fecha(p.fecha))} · ${p.tipo === 'noche' ? 'noche 20:00–08:00' : 'día 08:00–20:00'}</h4>`
      + `<div class="f"><span class="et ia">WRF + IA</span><p>${escH(t)}</p></div>`
      + `<div class="f"><span class="et of">Boletín oficial</span><p>${to ? escH(to) : `<span class="vac">${oDeHoy ? 'sin este período' : 'se publica a las 16:00'}</span>`}</p></div></div>`;
  };
  panel.innerHTML = tabs + acierto
    + `<div class="card"><h3>Pronóstico de bahía · ${escH(b.nombre)}</h3>${(b.periodos || []).map(per).join('')}</div>`
    + (b.nota ? `<div class="card"><h3>Criterio aplicado por la IA</h3><p class="nota" style="color:var(--ink)">${escH(b.nota)}</p></div>` : '')
    + `<p class="pie">Cada mañana, con la corrida 12Z del modelo WRF, el equipo local entrega a Claude el pronóstico WRF de la bahía, el oleaje WW3 y ejemplos de boletines del especialista; Claude redacta el pronóstico con el estilo y los criterios del especialista. Es un producto experimental de apoyo y no reemplaza el pronóstico oficial.</p>`;
  panel.querySelectorAll('.tabs button').forEach(x => x.onclick = () => seleccionar(x.dataset.c));
}
function seleccionar(cod) { SEL = cod; pintarMapa(); pintarPanel(); const i = BAHIAS[cod]; if (i && map.getZoom() > 6) map.panTo(i.pos); }

async function cargar() {
  const [bor, ofi, ver, av] = await Promise.all([leerJSON('data/borradores.json').catch(() => null), leerJSON('data/pronosticos.json').catch(() => null),
    leerJSON('data/evaluacion/resumen.json').catch(() => null), leerJSON('data/avisos.json').catch(() => null)]);
  if (av) pintarAvisos(av.avisos || []);
  VER = ver; OFI = {}; if (ofi) (ofi.items || []).forEach(x => { OFI[x.codigo] = x; });
  if (!bor || !(bor.bahias || []).length) { document.getElementById('sub').textContent = 'Aún no hay pronósticos WRF + IA: el equipo local los genera una vez al día con la corrida 12Z del WRF.'; document.getElementById('panel').innerHTML = '<div class="card vac">Sin pronósticos disponibles.</div>'; return; }
  BOR = bor;
  document.getElementById('sub').textContent = `Pronóstico de bahía redactado con IA a partir del WRF ${bor.wrf_inicializacion || '–'} UTC y el oleaje WW3 · generado ${hora(bor.generado)} (hora Chile)`;
  const q = new URLSearchParams(location.search).get('bahia');
  SEL = SEL || (bor.bahias.some(x => x.codigo === q) ? q : (bor.bahias.find(x => x.codigo === 'valparaiso') || bor.bahias[0]).codigo);
  pintarMapa(); pintarPanel();
}
cargar(); setInterval(cargar, 20 * 60 * 1000);
setInterval(async () => { try { const v = (await (await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })).text()).trim(); if (v && v !== VERSION_PAGINA) location.reload(); } catch (e) {} }, 10 * 60 * 1000);
</script>
<script>/*INSTALAR*/</script>
</body>
</html>
