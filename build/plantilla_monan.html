<style>/*LEAFLET_CSS*/</style>
<style>
:root{--bg:#0a1a2c;--panel:#0d2136;--line:#1e3a58;--ink:#e8f1fb;--mut:#93a9c0;--acc:#2f8cff;--chip:#0f2a45;--mo:#4fd1c5;--of:#5fd08a;--wrf:#5fb0ff;--ia:#b48cff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
a{color:#7fb8ff}
button,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:linear-gradient(180deg,#0e2540,#0a1d33);border-bottom:1px solid var(--line);flex-wrap:wrap}
.marca{display:flex;align-items:center;background:#fff;border-radius:9px;padding:4px 8px;flex:none}.marca img{height:42px;display:block}
.tit{border-left:1px solid var(--line);padding-left:16px;min-width:0;flex:1}
.tit h1{margin:0;font-size:20px;font-weight:700;color:#fff;line-height:1.2}.tit .sub{font-size:12.5px;color:var(--mut)}
.hDer{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btnV{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:9px;padding:8px 14px;text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}
.btnV.az{background:var(--acc);border-color:var(--acc);color:#fff}
main{flex:1;display:flex;min-height:0}
.mapa{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:#0b2236}
.panel{width:460px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:12px 14px 20px}
.card{background:#0b1d31;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:14px}
.nota{font-size:12px;color:var(--mut);margin:4px 0}
.tiempo{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;z-index:900;background:rgba(10,26,44,.94);border:1px solid var(--line);border-radius:10px;padding:7px 10px;display:flex;align-items:center;gap:8px;font-size:12.5px;max-width:calc(100% - 20px)}
.tiempo button{background:var(--chip);border:1px solid var(--line);border-radius:7px;width:32px;height:30px;cursor:pointer;font-size:16px}
.tiempo input{width:220px}
.tiempo b{white-space:nowrap}
.ley{position:absolute;right:10px;bottom:22px;z-index:900;background:rgba(10,26,44,.94);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:11.5px}
.ley .barra{width:190px;height:10px;border-radius:2px;margin:4px 0 2px}
.ley .esc{display:flex;justify-content:space-between;width:190px;color:var(--mut)}
.campo{position:absolute;top:10px;right:10px;z-index:900;background:rgba(10,26,44,.94);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12.5px}
.campo select{background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.tabs button{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:600;font-size:12.5px}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.dia{border-top:1px solid var(--line);padding:8px 0}.dia:first-of-type{border-top:0}
.dia h4{margin:0 0 4px;font-size:12.5px}
.f{display:grid;grid-template-columns:96px 1fr;gap:6px;margin:3px 0;font-size:12.5px}
.et{font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 6px;align-self:start;text-align:center}
.et.mo{background:rgba(79,209,197,.16);color:var(--mo)}.et.of{background:rgba(95,208,138,.16);color:var(--of)}.et.wrf{background:rgba(95,176,255,.16);color:var(--wrf)}.et.ia{background:rgba(180,140,255,.18);color:var(--ia)}
.f p{margin:0}
.vac{color:var(--mut);font-style:italic}
table.v{border-collapse:collapse;width:100%;font-size:12px}
table.v th,table.v td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.v thead th{color:var(--mut);font-weight:600;font-size:11px}
.estLbl{background:none;border:0}
.estLbl span{display:inline-block;transform:translate(-50%,-140%);white-space:nowrap;background:rgba(9,24,40,.9);border:1px solid var(--mo);color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;font-weight:700}
.leaflet-popup-content{font-size:12.5px;line-height:1.5}
@media (max-width:900px){
  body{overflow:auto;display:block}main{display:block}.mapa{height:62vh}.panel{width:auto;border-left:0;border-top:1px solid var(--line)}
  header{gap:8px 10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px}.marca img{height:34px}.tit{border:0;padding:0}.tit h1{font-size:16px}
  .hDer{width:100%;margin:0}.hDer .btnV{flex:1;text-align:center}.ley{display:none}.tiempo input{width:120px}
}
</style>
</head>

    <div class="campo"><label>Campo <select id="selCampo"><option value="viento">Viento a 10 m (kt)</option><option value="t2">Temperatura a 2 m (°C)</option><option value="precip">Precipitación acumulada (mm)</option><option value="cape">CAPE (J/kg)</option></select></label></div>
    <div class="tiempo"><button type="button" id="tAnt" aria-label="Plazo anterior">‹</button><input type="range" id="tSel" min="0" max="0" value="0" aria-label="Plazo"><button type="button" id="tSig" aria-label="Plazo siguiente">›</button><b id="tTxt">–</b></div>
    <div class="ley" id="ley"></div>
  </section>
  <aside class="panel" id="panel">
    <div class="card" id="cCorrida"><h3>Corrida</h3><div class="vac">Cargando…</div></div>
    <div class="card" id="cComp"><h3>Comparación con el pronóstico local</h3><div class="vac">Cargando…</div></div>
    <div class="card" id="cVer"><h3>Verificación diaria contra estaciones</h3><div class="vac">Cargando…</div></div>
  </aside>
</main>
<script>/*LEAFLET_JS*/</script>
<script>
/*DATA*/
const FUENTE_MONAN = 'https://feliperifo-a11y.github.io/trombas_marinas/data/monan_campos.json';
const escH = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, d = 0) => (v == null || isNaN(v)) ? '–' : Number(v).toFixed(d).replace('.', ',');
const sg = (v, d = 1) => v == null ? '–' : (v > 0 ? '+' : '') + nf(v, d);
const P16 = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
const cardinal = g => P16[Math.round(((g % 360) + 360) % 360 / 22.5) % 16];
const fmtCL = d => d.toLocaleString('es-CL', { timeZone: 'America/Santiago', weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).replace(',', '');
const diaCL = d => d.toLocaleDateString('en-CA', { timeZone: 'America/Santiago' });
const horaCL = d => +d.toLocaleString('en-GB', { timeZone: 'America/Santiago', hour: '2-digit', hour12: false });
const fechaLarga = f => new Date(f + 'T12:00:00').toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' });
async function leerJSON(ruta) { const r = await fetch(`${ruta}${ruta.includes('?') ? '&' : '?'}t=${Date.now()}`, { cache: 'no-store', signal: AbortSignal.timeout(60000) }); if (!r.ok) throw new Error(r.status); return r.json(); }
function decodePolyline6(str) {
  const out = []; let i = 0, lat = 0, lon = 0;
  while (i < str.length) { for (let k = 0; k < 2; k++) { let b, sh = 0, r = 0; do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20); const d = (r & 1) ? ~(r >> 1) : (r >> 1); if (k === 0) lat += d; else lon += d; } out.push([lat / 1e6, lon / 1e6]); }
  return out;
}

// ---- Mapa base
const map = L.map('map', { minZoom: 3, maxZoom: 13, zoomSnap: 0.25, zoomControl: false, preferCanvas: true });
L.control.zoom({ position: 'topleft' }).addTo(map);
L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);
map.createPane('landPane').style.zIndex = 250;
map.createPane('mallaPane').style.zIndex = 350;
map.createPane('costaPane').style.zIndex = 420; map.getPane('costaPane').style.pointerEvents = 'none';
map.createPane('estPane').style.zIndex = 640;
const oc = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri, GEBCO, NOAA', maxZoom: 16, maxNativeZoom: 13 }).addTo(map);
const costa = L.layerGroup().addTo(map);
for (const c of LAND) for (const poly of c.p) L.polygon(poly.map(decodePolyline6), { pane: 'costaPane', color: '#e8f1fb', weight: 0.7, opacity: 0.7, fill: false, interactive: false }).addTo(costa);
map.setView([-36.8, -73.2], 6);

// ---- Escalas de color
const ESC = {
  viento: { pts: [[0, [59, 31, 158]], [5, [34, 83, 214]], [10, [31, 162, 224]], [15, [33, 199, 154]], [20, [155, 226, 60]], [25, [245, 226, 58]], [30, [245, 154, 35]], [35, [229, 57, 53]], [40, [178, 31, 208]]], marcas: [0, 10, 20, 30, 40], uni: 'kt' },
  t2: { pts: [[0, [49, 54, 149]], [5, [69, 117, 180]], [10, [116, 173, 209]], [15, [254, 224, 144]], [20, [253, 174, 97]], [25, [244, 109, 67]], [30, [165, 0, 38]]], marcas: [0, 10, 20, 30], uni: '°C' },
  precip: { pts: [[0, [11, 34, 54]], [1, [120, 198, 230]], [5, [44, 127, 184]], [10, [37, 52, 148]], [25, [120, 40, 160]], [50, [220, 40, 120]]], marcas: [0, 5, 10, 25, 50], uni: 'mm' },
  cape: { pts: [[0, [11, 34, 54]], [100, [60, 120, 170]], [250, [80, 180, 120]], [500, [240, 220, 70]], [1000, [240, 140, 40]], [2000, [220, 40, 40]]], marcas: [0, 250, 500, 1000, 2000], uni: 'J/kg' },
};
function color(campo, v) {
  if (v == null || isNaN(v)) return null;
  const p = ESC[campo].pts; if (v <= p[0][0]) return `rgb(${p[0][1]})`;
  for (let i = 1; i < p.length; i++) if (v <= p[i][0]) { const [a, ca] = p[i - 1], [b, cb] = p[i], f = (v - a) / (b - a); return `rgb(${ca.map((c, k) => Math.round(c + f * (cb[k] - c))).join(',')})`; }
  return `rgb(${p[p.length - 1][1]})`;
}
function leyenda(campo) {
  const e = ESC[campo], max = e.pts[e.pts.length - 1][0];
  document.getElementById('ley').innerHTML = `<b>${escH(document.querySelector('#selCampo option:checked').textContent)}</b><div class="barra" style="background:linear-gradient(90deg,${e.pts.map(([v, c]) => `rgb(${c}) ${v / max * 100}%`).join(',')})"></div><div class="esc">${e.marcas.map(m => `<span>${m}</span>`).join('')}</div>`;
}

// ---- Datos MONAN
let M = null, CEL = [], CENTRO = [], LIM = null, IDX = 0, CAMPO = 'viento';
const capaMalla = L.layerGroup().addTo(map);
const capaFlechas = L.layerGroup().addTo(map);
const capaEst = L.layerGroup().addTo(map);
const val = (k, i, c) => { const f = M.campos[k], x = f.datos[i][c]; return x == null ? null : x / f.esc; };
function viento(i, c) { const u = val('u10', i, c), v = val('v10', i, c); if (u == null || v == null) return null; return { kt: Math.hypot(u, v), dir: (Math.atan2(-u, -v) * 180 / Math.PI + 360) % 360 }; }
function valor(campo, i, c) { if (campo === 'viento') { const w = viento(i, c); return w ? w.kt : null; } return val(campo, i, c); }
function construirMalla() {
  capaMalla.clearLayers(); CEL = []; CENTRO = [];
  const ren = L.canvas({ padding: 0.3, pane: 'mallaPane' });
  let s = 90, n = -90, w = 180, e = -180;
  M.celdas.forEach((vs, c) => {
    const ll = vs.map(k => [M.vlat[k], M.vlon[k]]);
    const la = ll.reduce((a, p) => a + p[0], 0) / ll.length, lo = ll.reduce((a, p) => a + p[1], 0) / ll.length;
    CENTRO.push([la, lo]);
    if (M.borde[c]) { CEL.push(null); return; }
    s = Math.min(s, la); n = Math.max(n, la); w = Math.min(w, lo); e = Math.max(e, lo);
    const p = L.polygon(ll, { renderer: ren, pane: 'mallaPane', stroke: false, fillOpacity: 0.72, fillColor: '#334' });
    p.on('click', ev => fichaCelda(c, ev.latlng));
    p.addTo(capaMalla); CEL.push(p);
  });
  LIM = L.latLngBounds([s, w], [n, e]);
}
function pintar() {
  for (let c = 0; c < CEL.length; c++) { const p = CEL[c]; if (!p) continue; const col = color(CAMPO, valor(CAMPO, IDX, c)); p.setStyle(col ? { fillColor: col, fillOpacity: 0.72, stroke: true, color: col, weight: 0.6, opacity: 0.72 } : { fillOpacity: 0, stroke: false }); }
  pintarFlechas();
  const p = M.plazos[IDX], vt = new Date(p.valida.replace('Z', ':00Z'));
  document.getElementById('tTxt').textContent = `${fmtCL(vt)} · +${p.fhr} h`;
  document.getElementById('tSel').value = IDX;
  leyenda(CAMPO);
}
function pintarFlechas() {
  capaFlechas.clearLayers();
  if (CAMPO === 'viento') {
    const paso = map.getZoom() >= 8 ? 0.12 : map.getZoom() >= 7 ? 0.25 : 0.5, vistas = new Set(), b = map.getBounds();
    CENTRO.forEach(([la, lo], c) => {
      if (!CEL[c] || !b.contains([la, lo])) return;
      const key = Math.round(la / paso) + ':' + Math.round(lo / paso); if (vistas.has(key)) return; vistas.add(key);
      const w = viento(IDX, c); if (!w || w.kt < 1) return;
      const rot = (w.dir + 180) % 360;
      L.marker([la, lo], { interactive: false, icon: L.divIcon({ className: '', iconSize: [16, 16], iconAnchor: [8, 8], html: `<svg width="16" height="16" viewBox="0 0 16 16" style="transform:rotate(${rot}deg)"><path d="M8 1 L12 9 L9 8 L9 15 L7 15 L7 8 L4 9 Z" fill="#fff" fill-opacity=".85" stroke="#0a1a2c" stroke-width=".6"/></svg>` }) }).addTo(capaFlechas);
    });
  }
}
function fichaCelda(c, ll) {
  const w = viento(IDX, c), t = val('t2', IDX, c), pr = val('precip', IDX, c), ca = val('cape', IDX, c);
  const vt = new Date(M.plazos[IDX].valida.replace('Z', ':00Z'));
  L.popup().setLatLng(ll).setContent(`<b>MONAN 3 km</b> · ${escH(fmtCL(vt))} (hora Chile)<br>Viento: ${w ? `${cardinal(w.dir)} ${nf(w.kt)} kt` : '–'}<br>Temperatura a 2 m: ${nf(t, 1)} °C<br>Precipitación acumulada: ${nf(pr, 1)} mm<br>CAPE: ${nf(ca)} J/kg<br><span style="color:#93a9c0">${M.tierra[c] ? 'Celda sobre tierra' : 'Celda sobre mar'} · ${nf(CENTRO[c][0], 2)}°, ${nf(CENTRO[c][1], 2)}°</span>`).openOn(map);
}
function celdaCercana(la, lo) {
  let best = -1, dmin = Infinity; const k = Math.cos(la * Math.PI / 180);
  CENTRO.forEach(([a, b], c) => { if (!CEL[c]) return; const d = (a - la) ** 2 + ((b - lo) * k) ** 2; if (d < dmin) { dmin = d; best = c; } });
  return { c: best, km: Math.sqrt(dmin) * 111 };
}
// Resumen de MONAN para un día 08:00–20:00 en una celda
function resumenDia(c, fecha) {
  const filas = [];
  M.plazos.forEach((p, i) => { const vt = new Date(p.valida.replace('Z', ':00Z')); if (diaCL(vt) === fecha && horaCL(vt) >= 8 && horaCL(vt) < 20) { const w = viento(i, c); if (w) filas.push({ ...w, t: val('t2', i, c) }); } });
  if (filas.length < 3) return null;
  const kts = filas.map(f => f.kt), dirs = filas.filter(f => f.kt >= 3).map(f => cardinal(f.dir));
  const unicas = [...new Set(dirs)];
  return { min: Math.min(...kts), max: Math.max(...kts), dirs: unicas.length ? unicas.join(' → ') : 'calma', tmax: Math.max(...filas.map(f => f.t).filter(x => x != null)) };
}

// ---- Comparación con el pronóstico local
let PRON = null, WRF = null, BOR = null, BAH = [], SELB = null;
function pintarComparacion() {
  const el = document.getElementById('cComp');
  if (!BAH.length) { el.innerHTML = '<h3>Comparación con el pronóstico local</h3><div class="vac">No hay bahías con pronóstico oficial dentro de la malla de esta corrida.</div>'; return; }
  const b = BAH.find(x => x.codigo === SELB) || BAH[0]; SELB = b.codigo;
  const wrf = WRF && (WRF.bahias || []).find(x => x.nombre === b.nombre);
  const bor = BOR && BOR.fecha_base && (BOR.bahias || []).find(x => x.codigo === b.codigo);
  const hoy = diaCL(new Date());
  // Los días anteriores a hoy ya no están en el boletín vigente ni en la corrida WRF actual: no se comparan
  const fechas = [...new Set(M.plazos.map(p => diaCL(new Date(p.valida.replace('Z', ':00Z')))))].filter(f => f >= hoy && resumenDia(b.celda, f));
  const dias = fechas.map(f => {
    const r = resumenDia(b.celda, f);
    const of = (b.periodos || []).find(q => q.fecha === f && (q.tipo === 'dia' || (q.horario || '').startsWith('08')));
    const wd = wrf && ((wrf.pronostico || {}).dias || []).find(q => q.fecha === f);
    const bd = bor && (bor.periodos || []).find(q => q.fecha === f && q.tipo === 'dia');
    return `<div class="dia"><h4>${escH(fechaLarga(f))} · día 08:00–20:00</h4>`
      + `<div class="f"><span class="et mo">MONAN</span><p>Viento ${escH(r.dirs)} ${nf(r.min)}/${nf(r.max)} kt · T máx. ${nf(r.tmax)} °C</p></div>`
      + `<div class="f"><span class="et of">Boletín oficial</span><p>${of ? `${escH(of.viento || of.texto)}${of.tmax != null ? ` · T máx. ${of.tmax} °C` : ''}` : '<span class="vac">sin este día</span>'}</p></div>`
      + `<div class="f"><span class="et wrf">WRF</span><p>${wd ? `${escH(wd.viento)}${wd.temp_max != null ? ` · T máx. ${wd.temp_max} °C` : ''}` : '<span class="vac">sin este día</span>'}</p></div>`
      + (bor ? `<div class="f"><span class="et ia">WRF + IA</span><p>${bd ? `${escH(bd.texto)}${bd.tmax != null ? ` · T máx. ${bd.tmax} °C` : ''}` : '<span class="vac">sin este día</span>'}</p></div>` : '')
      + '</div>';
  }).join('');
  el.innerHTML = `<h3>Comparación con el pronóstico local</h3><div class="tabs" role="tablist">${BAH.map(x => `<button type="button" role="tab" data-c="${escH(x.codigo)}" aria-selected="${x.codigo === SELB}">${escH(x.nombre)}</button>`).join('')}</div>`
    + `<p class="nota">MONAN en la celda más cercana al punto de la bahía (${nf(b.km, 1)} km), entre las 08:00 y las 20:00. Boletín oficial emitido ${escH(b.emitido || '–')}.</p>${dias || '<div class="vac">La corrida de MONAN publicada no cubre días desde hoy en adelante; la comparación aparece con la próxima corrida.</div>'}`;
  el.querySelectorAll('.tabs button').forEach(x => x.onclick = () => { SELB = x.dataset.c; pintarComparacion(); const bb = BAH.find(y => y.codigo === SELB); if (bb) map.panTo(bb.pos); });
}

// ---- Verificación
function pintarVerificacion(v) {
  const el = document.getElementById('cVer');
  if (!v || !v.estaciones) { el.innerHTML = '<h3>Verificación diaria contra estaciones</h3><div class="vac">La verificación se publica una vez al día.</div>'; return; }
  const filas = v.estaciones.map(e => { const r = v.resumen[e.codigo] || {}; return `<tr><th>${escH(e.nombre)}</th><td>${nf(e.dist_km, 1)} km</td><td>${r.n ? `<b>${nf(r.puntaje)} %</b>` : '<span class="vac">sin días aún</span>'}</td><td>${r.n || 0}</td><td>${r.n ? `${sg(r.sesgo_int)} kt` : '–'}</td><td>${r.n && r.error_tmax_abs != null ? `${nf(r.error_tmax_abs, 1)} °C` : '–'}</td></tr>`; }).join('');
  const ult = (v.dias || []).filter(d => d.pauta).slice(0, 10).map(d => `<tr><td>${escH(d.fecha.slice(8, 10) + '/' + d.fecha.slice(5, 7))}</td><th>${escH((v.estaciones.find(e => e.codigo === d.est) || {}).nombre || d.est)}</th><td><b>${nf(d.pauta.puntaje)} %</b></td><td>${nf(d.pauta.int_pron, 1)} / ${nf(d.pauta.int_obs, 1)} kt</td><td>${d.pauta.tmax_pron != null ? `${nf(d.pauta.tmax_pron, 1)} / ${nf(d.obs.tmax, 1)} °C` : '–'}</td></tr>`).join('');
  el.innerHTML = `<h3>Verificación diaria contra estaciones</h3><p class="nota">Pauta O.P.I. N° 1104 (dirección, intensidad y temperatura máxima, 08:00–20:00) con la corrida iniciada a lo menos 12 h antes del día. Corridas archivadas: ${(v.corridas || []).length}.</p>`
    + `<table class="v"><thead><tr><th>Estación</th><th title="Distancia a la celda">Celda</th><th>Acierto</th><th>Días</th><th title="Observado − pronosticado">Sesgo int.</th><th>|Error Tmáx|</th></tr></thead><tbody>${filas}</tbody></table>`
    + (ult ? `<h3 style="margin-top:10px">Últimos días evaluados</h3><table class="v"><thead><tr><th>Día</th><th>Estación</th><th>Acierto</th><th>Viento MONAN / obs.</th><th>Tmáx MONAN / obs.</th></tr></thead><tbody>${ult}</tbody></table>` : '<p class="nota">Aún no hay días completos para evaluar: se necesita una corrida que cubra el día completo (08:00 a 20:00) con 12 h de anticipación.</p>');
  capaEst.clearLayers();
  for (const e of v.estaciones) L.marker([e.lat, e.lon], { pane: 'estPane', icon: L.divIcon({ className: 'estLbl', html: `<span>${escH(e.nombre)}</span>`, iconSize: [0, 0] }) }).addTo(capaEst);
}

async function cargar() {
  try { M = await leerJSON(FUENTE_MONAN); } catch (e) { document.getElementById('sub').textContent = 'No se pudo leer la corrida de MONAN.'; return; }
  const ini = new Date(M.corrida.replace(/T(\d\d)Z$/, 'T$1:00:00Z')), ult = M.plazos[M.plazos.length - 1];
  const edadH = (Date.now() - ini) / 3600e3;
  document.getElementById('sub').innerHTML = (edadH > 30 ? `<b style="color:#ffb35c">⚠ Corrida de hace ${Math.round(edadH)} h, aún no llega una más reciente.</b> ` : '') + escH(`Corrida ${M.corrida.replace('T', ' ')} · ${M.plazos.length} plazos cada 3 h hasta +${ult.fhr} h · ${M.fuente}`);
  construirMalla();
  map.fitBounds(LIM, { padding: [20, 20] });
  const sel = document.getElementById('tSel'); sel.max = M.plazos.length - 1;
  const ahora = Date.now(); IDX = M.plazos.reduce((b, p, i) => Math.abs(new Date(p.valida.replace('Z', ':00Z')) - ahora) < Math.abs(new Date(M.plazos[b].valida.replace('Z', ':00Z')) - ahora) ? i : b, 0);
  if (IDX === 0 && M.plazos.length > 1) IDX = 1;          // en t = 0 MPAS no entrega viento ni temperatura a 10 y 2 m
  pintar();
  document.getElementById('cCorrida').innerHTML = `<h3>Corrida</h3><p class="nota" style="color:var(--ink)">Inicio ${escH(fmtCL(ini))} (hora Chile) · ${M.celdas.length.toLocaleString('es-CL')} celdas · plazos cada 3 h hasta +${ult.fhr} h.</p><p class="nota">${escH(M.fuente)}. Corrida experimental en un computador propio: no constituye pronóstico oficial.</p>`;
  const [p, w, b, v] = await Promise.all([leerJSON('data/pronosticos.json').catch(() => null), leerJSON('data/wrf_ia.json').catch(() => null), leerJSON('data/borradores.json').catch(() => null), leerJSON('data/evaluacion/monan.json').catch(() => null)]);
  PRON = p; WRF = w; BOR = b;
  BAH = ((p && p.items) || []).filter(x => x.tipo === 'bahia' && x.pos && LIM.contains(x.pos)).map(x => { const cc = celdaCercana(x.pos[0], x.pos[1]); return { ...x, celda: cc.c, km: cc.km }; }).filter(x => x.km < 15).sort((a, b2) => b2.pos[0] - a.pos[0]);
  SELB = SELB || (BAH.find(x => x.codigo === 'talcahuano') || BAH[0] || {}).codigo;
  pintarComparacion();
  pintarVerificacion(v);
}
document.getElementById('tSel').oninput = e => { IDX = +e.target.value; pintar(); };
document.getElementById('tAnt').onclick = () => { if (M && IDX > 0) { IDX--; pintar(); } };
document.getElementById('tSig').onclick = () => { if (M && IDX < M.plazos.length - 1) { IDX++; pintar(); } };
document.getElementById('selCampo').onchange = e => { CAMPO = e.target.value; if (M) pintar(); };
document.getElementById('btnMalla').onclick = () => { if (LIM) map.fitBounds(LIM, { padding: [20, 20] }); };
map.on('zoomend moveend', () => { if (M) pintarFlechas(); });
cargar();
setInterval(async () => { try { const v = (await (await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })).text()).trim(); if (v && v !== VERSION_PAGINA) location.reload(); } catch (e) {} }, 10 * 60 * 1000);
</script>
<script>/*INSTALAR*/</script>
</body>
</html>
